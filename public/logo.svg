<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <!-- Soft Realistic Drop Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bevel / Subtle Depth Gradients -->
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="needleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <g id="brand-logo" filter="url(#shadow)">
    <!-- ============================================================== -->
    <!-- 1. COMPASS / GLOBE RING (Centered behind book & needle)        -->
    <!-- ============================================================== -->
    <circle cx="500" cy="188" r="62" 
            fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

    <!-- ============================================================== -->
    <!-- 2. OPEN BOOK                                                   -->
    <!-- ============================================================== -->
    <!-- Left Page Outer Boundary -->
    <path d="M 494,124 
             C 464,126 424,121 390,135 
             C 385,137 382,141 382,146 
             L 382,246 
             C 382,252 387,256 392,253 
             C 426,239 466,244 494,250 
             Z" 
          fill="#ffffff" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Page Inner Panel Line -->
    <path d="M 484,142 
             C 458,144 424,141 402,151 
             L 402,236 
             C 424,227 458,230 484,235 
             Z" 
          fill="none" stroke="#64748b" stroke-width="3" opacity="0.3" stroke-linejoin="round" />

    <!-- Right Page Outer Boundary -->
    <path d="M 506,124 
             C 536,126 576,121 610,135 
             C 615,137 618,141 618,146 
             L 618,246 
             C 618,252 613,256 608,253 
             C 574,239 534,244 506,250 
             Z" 
          fill="#ffffff" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Page Inner Panel Line -->
    <path d="M 516,142 
             C 542,144 576,141 598,151 
             L 598,236 
             C 576,227 542,230 516,235 
             Z" 
          fill="none" stroke="#64748b" stroke-width="3" opacity="0.3" stroke-linejoin="round" />

    <!-- Book Bottom Thickness Edge (Fanned Pages Foundation) -->
    <path d="M 382,246 C 424,264 466,258 500,274 C 534,258 576,264 618,246 L 618,254 C 576,272 534,266 500,282 C 466,266 424,272 382,254 Z" 
          fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Book Center Spine Seam -->
    <line x1="500" y1="126" x2="500" y2="278" stroke="#cbd5e1" stroke-width="2" />

    <!-- ============================================================== -->
    <!-- 3. GRADUATION CAP (MORTARBOARD)                                -->
    <!-- Centered atop book                                             -->
    <!-- ============================================================== -->
    <!-- Skull Cap Underside -->
    <path d="M 462,64 Q 500,76 538,64 L 534,84 Q 500,94 466,84 Z" 
          fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Mortarboard Diamond (Perspective) -->
    <polygon points="500,24 572,50 500,76 428,50" 
             fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Mortarboard Center Button -->
    <ellipse cx="500" cy="50" rx="4" ry="3" fill="#cbd5e1" />
    
    <!-- Tassel Cord & Hanging Ribbon -->
    <path d="M 500,50 Q 532,54 554,66 L 554,104" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tassel Fringe Tip -->
    <polygon points="551,104 557,104 559,118 549,118" 
             fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- ============================================================== -->
    <!-- 4. DIAGONAL COMPASS NEEDLE                                     -->
    <!-- Piercing through center, extending past top-right of book      -->
    <!-- ============================================================== -->
    <!-- Center Pivot Ring Housing -->
    <circle cx="500" cy="188" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="500" cy="188" r="7" fill="#0f172a" />

    <!-- Top-Right Needle (Light Facet) -->
    <polygon points="500,188 494,174 606,94" 
             fill="url(#needleLight)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Top-Right Needle (Dark Facet) -->
    <polygon points="500,188 510,194 606,94" 
             fill="url(#needleDark)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Bottom-Left Needle (Light Facet) -->
    <polygon points="500,188 506,202 406,268" 
             fill="url(#needleLight)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Bottom-Left Needle (Dark Facet) -->
    <polygon points="500,188 490,182 406,268" 
             fill="url(#needleDark)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Center Pivot Pin -->
    <circle cx="500" cy="188" r="3.5" fill="#ffffff" />

    <!-- ============================================================== -->
    <!-- 5. TYPOGRAPHY: LINE 1 "GERMANY with"                           -->
    <!-- ============================================================== -->
    <g transform="translate(500, 350)" text-anchor="middle">
      <text font-family="Liberation Sans, Montserrat, -apple-system, sans-serif" 
            font-size="54" 
            font-weight="900" 
            fill="#ffffff" 
            letter-spacing="4"
            dx="-42">GERMANY</text>
      <text font-family="Liberation Sans, -apple-system, sans-serif" 
            font-size="34" 
            font-weight="400" 
            font-style="italic"
            fill="#ffffff" 
            letter-spacing="1"
            dx="140" dy="-3">with</text>
    </g>

    <!-- ============================================================== -->
    <!-- 6. TYPOGRAPHY: LINE 2 "PRAKHAR" + ARROW FLOURISH               -->
    <!-- ============================================================== -->
    <g transform="translate(500, 422)" text-anchor="middle">
      <text font-family="Liberation Sans, Montserrat, -apple-system, sans-serif" 
            font-size="64" 
            font-weight="900" 
            fill="#ffffff" 
            letter-spacing="5">PRAKHAR</text>
    </g>

    <!-- Swoop Flourish extending from 'R' in PRAKHAR -->
    <!-- Sweeps under 'HAR' to the right with an arrow tip -->
    <path d="M 646,428 
             C 656,448 626,478 586,476 
             C 554,474 538,454 526,444 
             C 510,430 488,440 484,456 
             C 478,476 502,500 538,500 
             C 580,500 626,466 638,450" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Arrowhead pointing up-right at end of flourish -->
    <polygon points="636,440 644,458 626,454" fill="#ffffff" />

    <!-- ============================================================== -->
    <!-- 7. LEAF MOTIF                                                  -->
    <!-- Centered directly below PRAKHAR                                -->
    <!-- ============================================================== -->
    <g transform="translate(500, 492)">
      <!-- Leaf contour -->
      <path d="M 0,-20 
               C 14,-12 18,8 0,24 
               C -18,8 -14,-12 0,-20 Z" 
            fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
      <!-- Central stem -->
      <line x1="0" y1="-16" x2="0" y2="20" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Delicate side ribs -->
      <line x1="0" y1="-8" x2="6" y2="-4" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="0" y1="-8" x2="-6" y2="-4" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="0" y1="2" x2="7" y2="7" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="0" y1="2" x2="-7" y2="7" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="0" y1="12" x2="5" y2="16" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="0" y1="12" x2="-5" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    </g>
  </g>
</svg>
